name: Publish ELS API OKF to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build bundle from frozen source registers
        run: python scripts/build_bundle.py

      - name: Verify deterministic rebuild
        run: python scripts/build_bundle.py --check

      - name: Validate OKF v0.2 concept layer
        run: python scripts/check_okf.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate generated JSON
        run: find bundle source -name '*.json' -print0 | xargs -0 -n1 python -m json.tool >/dev/null

      - name: Verify public entrypoints
        run: |
          test -f bundle/index.html
          test -f bundle/index.md
          test -f bundle/.nojekyll
          test -f bundle/okf-explorer.json
          test -f bundle/okf-bundle.jsonld
          test -f bundle/okf-bundle.yamlld
          test -f bundle/data/standards/okf-v0.2.json
          test -f bundle/data/openapi.json
          test -f bundle/data/review/issues.json
          test -f bundle/data/coverage/ledger.json

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: bundle
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
