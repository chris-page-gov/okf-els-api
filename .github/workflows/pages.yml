name: Publish ELS API OKF to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Validate publication contract
        run: python scripts/check_publication_contract.py

      - name: Check documentation and changelog lockstep
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            python scripts/check_documentation_lockstep.py --base "$BASE_SHA...HEAD"
          else
            python scripts/check_documentation_lockstep.py
          fi

      - name: Verify committed bundle before publication
        run: python scripts/build_bundle.py --check

      - name: Validate OKF v0.2 concept layer
        run: python scripts/check_okf.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate generated JSON
        run: find bundle source -name '*.json' -print0 | xargs -0 -n1 python -m json.tool >/dev/null

      - name: Verify public entrypoints
        run: |
          test -f bundle/index.html
          test -f bundle/index.md
          test -f bundle/.nojekyll
          test -f bundle/okf-explorer.json
          test -f bundle/okf-bundle.jsonld
          test -f bundle/okf-bundle.yamlld
          test -f bundle/data/standards/okf-v0.2.json
          test -f bundle/data/openapi.json
          test -f bundle/data/review/issues.json
          test -f bundle/data/coverage/ledger.json

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: bundle
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages-publication
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
